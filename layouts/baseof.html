<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta http-equiv="Content-Style-Type" content="text/css" />
    <meta http-equiv="Content-Script-Type" content="text/javascript" />
    <title>{{ if .IsPage }}{{ .Title }} - {{ end }}{{ .Site.Title }}</title>
    {{ with .Site.Params.description }}<meta name="description" content="{{ . }}" />{{ end }}
    {{ with .Site.Params.keywords }}<meta name="keywords" content="{{ . }}" />{{ end }}
    <link rel="shortcut icon" href="{{ "theme/blog.jiikko.com/favicon.ico" | relURL }}" />
    <link rel="alternate" href="{{ "index.atom" | absURL }}" type="application/atom+xml" />
    <link rel="stylesheet" href="{{ "theme/blog.jiikko.com/style.css" | relURL }}" type="text/css" />
    {{ with .Site.Params.googleanalyticsid }}
    <script>
      (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
      (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
      m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
      })(window,document,'script','https://www.google-analytics.com/analytics.js','ga');
      ga('create', '{{ . }}', 'auto');
      ga('send', 'pageview');
    </script>
    {{ end }}
  </head>
  <body>
    <div id="header">
      <h1><a href="{{ .Site.Home.RelPermalink }}">{{ .Site.Title }}</a></h1>
      <div class="section">
        <div class="nav site_link">
          <ul class="links">
            <li><a href="https://github.com/jiikko">Github</a></li>
            <li><a href="https://twitter.com/jiikko">Twitter</a></li>
          </ul>
          <p style="clear:both"></p>
        </div>
      </div>
    </div>
    <div id="container">
      <div id="main">
        {{ block "main" . }}{{ end }}

        <hr />
      </div>
    </div>
    <div id="footer">
      <p id="copy"><a href="https://jiikko.com">©jiikko.com</a></p>
    </div>
  </body>
</html>
