{{ define "main" }}
<h2>{{ .Title }}</h2>
{{ $pages := .Pages.ByDate.Reverse }}
{{ if gt (len $pages) 0 }}
  {{ $paginator := .Paginate $pages }}
  {{ range $paginator.Pages }}{{ partial "post-row.html" . }}{{ end }}
  {{ partial "pagination.html" . }}
{{ else }}
  <p>記事はまだありません。</p>
{{ end }}
{{ end }}
