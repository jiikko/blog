baseURL = "https://blog.jiikko.com/"
locale = "ja-JP"
timeZone = "Asia/Tokyo"
title = "blog.jiikko.com"
publishDir = "dist"
# Lokka served tag pages at /tags/<name as typed>/ (e.g. /tags/ErgodoxEZ/); keep the case.
disablePathToLower = true
# Lokka showed tag and category names as typed ("ruby"); Hugo would title-case them.
capitalizeListTitles = false

[pagination]
pagerSize = 10
path = "page"

[taxonomies]
category = "category"
tag = "tags"

[params]
description = ""
keywords = ""

# Posts were written for redcarpet without SmartyPants; keep quotes and dashes as typed.
# The Lokka theme never colored code (style.css has no highlight rules); keep fenced code as plain <pre><code>.
[markup.highlight]
codeFences = false

[markup.goldmark.extensions]
typographer = false

[markup.goldmark.renderer]
# Legacy entries contain rendered HTML, embeds, and data URI images.
unsafe = true

[mediaTypes."application/atom+xml"]
suffixes = ["atom"]

[outputFormats.atom]
mediaType = "application/atom+xml"
baseName = "index"
isPlainText = false
isHTML = false
rel = "alternate"
noUgly = true

[outputs]
home = ["html", "atom"]
